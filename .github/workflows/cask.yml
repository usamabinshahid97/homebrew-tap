name: Cask checks

on:
  push:
    branches: [main]
    paths:
      - Casks/**
      - .github/workflows/cask.yml
  pull_request:
    paths:
      - Casks/**
      - .github/workflows/cask.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Homebrew
        run: |
          test "$(uname -m)" = arm64
          brew update
          brew tap usamabinshahid97/tap "$GITHUB_WORKSPACE"
          if brew commands | grep -qx trust; then
            brew trust --cask usamabinshahid97/tap/cmf-companion
          fi
      - name: Style
        run: brew style --cask usamabinshahid97/tap/cmf-companion
      - name: Audit
        run: brew audit --cask --strict --online usamabinshahid97/tap/cmf-companion
      - name: Install, verify, and uninstall
        run: |
          mkdir -p "$RUNNER_TEMP/cmf-apps"
          brew install --yes --cask --appdir="$RUNNER_TEMP/cmf-apps" usamabinshahid97/tap/cmf-companion
          codesign --verify --deep --strict "$RUNNER_TEMP/cmf-apps/CMF Companion.app"
          xattr -p com.apple.quarantine "$RUNNER_TEMP/cmf-apps/CMF Companion.app"
          brew uninstall --cask cmf-companion
          test ! -e "$RUNNER_TEMP/cmf-apps/CMF Companion.app"
